{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>BookTracker Application</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <link rel="stylesheet" href="{% static 'style.css' %}">

  <style>
    html{ scroll-behavior:smooth; }
    :root{
      --nav-overlay: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0));
      --nav-height:64px;
    }

    .navbar{
      height: var(--nav-height);
      background: var(--nav-overlay) !important;  
    }
    .navbar .navbar-brand,
    .navbar .nav-link{ color:#fff !important; font-weight:600; }
    .navbar .nav-link:hover{ opacity:.9; }

    .dropdown-menu{
      background: #1b1f3a;
      border: 1px solid rgba(255,255,255,.12);
      min-width: 14rem;
    }
    .dropdown-item{ color:#e6e8ff; }
    .dropdown-item:hover{ background:rgba(255,255,255,.10); color:#fff; }

    main{ padding-top: 0; } 
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">BookTracker</a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain"
              aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
          </li>
        </ul>

        <ul class="navbar-nav ml-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="menuDrop" role="button" data-toggle="dropdown"
               aria-haspopup="true" aria-expanded="false">Menú</a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="menuDrop">
              {% if user.is_authenticated %}
                <a class="dropdown-item" href="/books">Books</a>
                <a class="dropdown-item" href="/books/create">Create Book</a>
                <a class="dropdown-item" href="/dashboard">Dashboard</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="/logout">Log Out</a>
              {% else %}
                <a class="dropdown-item" href="/signup">Sign Up</a>
                <a class="dropdown-item" href="/signin">Log In</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="/books">Books</a>
              {% endif %}
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
