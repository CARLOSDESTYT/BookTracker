{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookTracker</title>

  <!-- Bootstrap (opcional, si ya lo usas) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <style>
    /* Scroll suave para el “Learn more” → #about */
    html { scroll-behavior: smooth; }

    /* Reset básico para que el fondo beige anterior no afecte */
    body {
      margin: 0;
      background: #4F2DBD; /* color base morado por si no carga la imagen del hero */
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }

    /* NAV */
    .site-nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(30,16,90,0.35);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand {
      font-weight: 800; letter-spacing: .5px;
      color: #fff !important; text-decoration: none;
    }
    .menu a {
      color: #fff !important; text-decoration: none; font-weight: 600;
      padding: 12px 14px; border-radius: 10px; display: inline-block;
    }
    .menu a:hover { background: rgba(255,255,255,.1); }

    /* El contenido no debe ir dentro de un wrapper con fondo beige */
    main { min-height: 100vh; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <nav class="site-nav">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <a class="brand" href="{% url 'home' %}">BookTracker</a>

      <div class="menu d-flex align-items-center">
        <a href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
          <a href="/books">Books</a>
          <a href="/books/create">Create Book</a>
          <a href="/dashboard">Dashboard</a>
          <a href="/logout">Log Out</a>
        {% else %}
          <a href="/signup">Sign Up</a>
          <a href="/signin">Log In</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- JS de Bootstrap (opcional) -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
